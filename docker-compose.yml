version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: focusbuddy_db
    restart: always
    env_file:
      - ./be/.env
    ports:
      - "5433:5432" # Ánh xạ cổng 5433 trên máy thật vào 5432 của PostgreSQL trong container
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./be
    container_name: focusbuddy_be
    ports:
      - "8000:8000"
    volumes:
      - ./be:/app # Mount thư mục backend vào container để hỗ trợ hot reload
    env_file:
      - ./be/.env
    depends_on:
      - db
    # Chạy lệnh này để đè lên CMD trong Dockerfile và luôn đảm bảo hot reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./fe
    container_name: focusbuddy_fe
    ports:
      - "3000:3000"
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules # Named volume giữ node_modules trong container
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true # Cần thiết cho hot reload trên Windows
    depends_on:
      - backend

volumes:
  postgres_data:
  fe_node_modules: # Named volume riêng cho node_modules của frontend
