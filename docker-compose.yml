version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: focusbuddy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: focusbuddy_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./be
    container_name: focusbuddy_be
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8018"
    volumes:
      - ./be:/app
    env_file:
      - ./be/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8018", "--reload" ]

  celery_worker:
    build: ./be
    container_name: focusbuddy_celery_worker
    restart: unless-stopped
    volumes:
      - ./be:/app
    env_file:
      - ./be/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

  frontend:
    build: ./fe
    container_name: focusbuddy_fe
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  ai:
    build: ./ai
    container_name: focusbuddy_ai_worker
    restart: unless-stopped
    volumes:
      - ./ai:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - ./ai/.env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app.celery_app worker -Q ocr_queue --loglevel=info

volumes:
  postgres_data:
  redis_data:
  fe_node_modules:
